<style>

<style id="skin">
/* ===== SKIN v3: bố cục rộng theo ảnh giao diện, hình vẽ riêng của Tintin ===== */
:root{--frame:#e9d9a8;--cream:#fffaf0}
main{max-width:1180px;padding:10px 22px 110px;position:relative;z-index:1}
header{justify-content:space-between;align-items:center;padding:6px 0 4px}
.brand{font-size:1.6rem;font-weight:800;color:#2d3658;letter-spacing:.2px}.brand b{background:#9be8c4;border-radius:20px;padding:0 10px;margin-left:3px}
/* nền theo vùng */
body{position:relative}
body::before{content:"☀️";position:fixed;right:4vw;top:3vh;font-size:min(9vw,92px);pointer-events:none;z-index:0;filter:drop-shadow(0 0 28px #fff3a0)}
body::after{content:"🌳  🌼  🌲  🍄  🌿  🌼  🌳  🌼  🌲";position:fixed;left:0;right:0;bottom:-4px;text-align:center;font-size:clamp(26px,4vw,54px);letter-spacing:2.2vw;white-space:nowrap;overflow:hidden;pointer-events:none;z-index:0;opacity:.95}
body.sky{background:linear-gradient(#6cc8ff,#b6e6ff 50%,#e4f6ff)}
body.meadow{background:radial-gradient(70% 26% at 10% 102%,#8fd16a 0 98%,transparent 100%),radial-gradient(60% 22% at 92% 104%,#7cc65a 0 98%,transparent 100%),linear-gradient(#8fd3ff,#cdeeff 55%,#eaf8d0)}
